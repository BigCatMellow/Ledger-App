name: Bootstrap Ledger public app

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bootstrap-ledger.yml'

permissions:
  contents: write
  issues: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rebuild staged Ledger app archive
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXPECTED_SHA256: bd140a0479e1d8e4c1461a75a249144f9ea66c51ec5b3bafc508126fbed661d2
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, re, urllib.request, zipfile
          from pathlib import Path

          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          expected = os.environ['EXPECTED_SHA256']
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/issues/1/comments?per_page=100',
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(req) as response:
              comments = json.load(response)

          parts = {}
          pattern = re.compile(r'^LEDGER_BOOTSTRAP_ZIP part=(\d+)/5 sha256=([0-9a-f]{64})\n(.+)$', re.S)
          for comment in comments:
              body = comment.get('body', '')
              match = pattern.match(body)
              if not match:
                  continue
              n = int(match.group(1))
              if match.group(2) != expected:
                  raise SystemExit(f'Checksum tag mismatch on part {n}')
              parts[n] = ''.join(match.group(3).split())

          if sorted(parts) != [1, 2, 3, 4, 5]:
              raise SystemExit(f'Expected parts 1-5, found {sorted(parts)}')

          payload = base64.b64decode(''.join(parts[i] for i in range(1, 6)), validate=True)
          actual = hashlib.sha256(payload).hexdigest()
          if actual != expected:
              raise SystemExit(f'Archive checksum mismatch: {actual}')

          archive = Path('/tmp/ledger-app-bootstrap.zip')
          archive.write_bytes(payload)
          allowed = {'index.html', 'support.js', 'sync.html', '.nojekyll'}
          with zipfile.ZipFile(archive) as zf:
              names = set(zf.namelist())
              if names != allowed:
                  raise SystemExit(f'Unexpected archive contents: {sorted(names)}')
              zf.extractall('.')
          print('Verified and extracted:', ', '.join(sorted(allowed)))
          PY

      - name: Commit public app files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html support.js sync.html .nojekyll
          if git diff --cached --quiet; then
            echo 'Public app files already match the staged archive.'
          else
            git commit -m 'Deploy Ledger public app'
            git push
          fi
