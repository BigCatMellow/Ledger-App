name: Build Ledger Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'stationery/android-bridge.js'
      - 'stationery/android-sync.html'
      - '.github/workflows/build-ledger-android.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK artifact
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Ledger.apk
          sha256sum Ledger.apk > Ledger.apk.sha256

      - name: Upload Ledger APK
        uses: actions/upload-artifact@v7
        with:
          name: Ledger-Android-debug
          path: |
            Ledger.apk
            Ledger.apk.sha256
          if-no-files-found: error
          retention-days: 30
